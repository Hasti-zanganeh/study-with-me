<script>
/* ============================================================
   CONTENT — add new subjects and units here.
   ============================================================ */
const SITE = {
  title: "Study with me",
  tagline: "Open study notes with live diagrams, quizzes and flashcards. Built while learning, shared as it goes.",
  subjects: [{
    id:"snn", title:"Spiking neural networks",
    blurb:"Working through the maths behind event-driven networks, from the membrane equation to federated training.",
    units:[{
      id:"day2", n:"Day 2", title:"The CUBA LIF equations",
      blurb:"How a spike becomes a current, a current becomes a voltage, and a voltage becomes the next spike.",
      notes:[
        {t:"h",v:"Three equations, and that's the whole neuron"},
        {t:"p",v:"A spiking neuron looks complicated until you see that it runs the same three lines every timestep. Nothing else is needed to simulate it. Here they are in discrete time, which is what code actually runs."},
        {t:"eq",v:"I[n+1] = α·I[n] + Σ W·S[n]\n<em>keep most of the old current, then add the weights of whoever just spiked</em>"},
        {t:"eq",v:"U[n+1] = β·U[n] + I[n] − S[n]\n<em>keep most of the old voltage, add the current, and if you just fired, subtract 1</em>"},
        {t:"eq",v:"S[n] = Θ(U[n] − ϑ)\n<em>fire if the voltage reached threshold</em>"},
        {t:"p",v:"Throughout, the resting potential is 0, resistance is 1, and the threshold ϑ is 1. Those are normalisations, not physics — any other values can be absorbed by rescaling the weights."},

        {t:"h",v:"Start with the voltage on its own"},
        {t:"p",v:"Before any spiking, a leaky integrate-and-fire neuron is just a voltage being pulled in two directions. A leak drags it back toward rest. An input current pushes it away. Whichever is stronger at that moment decides which way it moves."},
        {t:"eq",v:"τ_mem · dU/dt = −(U − U_rest) + R·I\n<em>the leak term grows as U climbs; the current term does not</em>"},
        {t:"p",v:"That asymmetry is the interesting part. The current is fixed, but the leak gets stronger the further the voltage travels. Eventually they cancel and the voltage stops."},
        {t:"widget",v:"lif"},
        {t:"p",v:"Set the current low and the voltage flattens out below threshold and stays there forever. That is the leak winning. A perfect integrator would eventually fire on any positive input; this neuron will not. The grey line marks where it settles, which is exactly where the two terms are equal in size."},
        {t:"p",v:"Push the current past 1.0 and the settling point moves above threshold, so the neuron fires before it can ever get there. Stronger input means a steeper climb and less time between spikes — that current-to-rate relationship is the spiking counterpart of an activation function."},
        {t:"note",v:"<p><b>τ_mem is the neuron's memory span.</b> After one τ_mem the voltage has covered about 63% of the distance to wherever it is heading; after three, about 95%. Small τ_mem means a coincidence detector. Large τ_mem means an integrator.</p>"},

        {t:"h",v:"Now the detour that makes it current-based"},
        {t:"p",v:"Here is the thing most people get wrong on first reading. A spike does not touch the membrane voltage. It touches a current, and the current then charges the membrane. The weights W live in the current equation, not the voltage equation."},
        {t:"eq",v:"spike  →  I  →  U  →  spike\n<em>two leaky stages in series, with two separate time constants</em>"},
        {t:"p",v:"That detour is what \"current-based\" — CUBA — means, and it is the one sentence this whole topic is built around. Watch what it does to the shape of the signal:"},
        {t:"widget",v:"cuba"},
        {t:"p",v:"The input spikes are instant vertical lines. The current is jagged, jumping at each spike and decaying between them. The voltage is smoother still, with no sharp jumps at all. Each stage rounds off the signal once more."},
        {t:"p",v:"Try τ_syn very small and each spike's charge vanishes before it can do anything. Try it large and charge from separate spikes piles up instead of decaying, so several weak inputs can add together and cross threshold. That is temporal summation, and it is why the second time constant earns its place."},
        {t:"note",v:"<p><b>Plain LIF is the τ_syn → 0 limit of CUBA.</b> Current-based is not a different model. It is the same model with the assumption of instantaneous synapses relaxed. That is the cleanest way to state the relationship.</p>"},

        {t:"h",v:"Why a spike produces a finite jump"},
        {t:"p",v:"In continuous time a spike train is written as a sum of Dirac deltas, which have zero width and infinite height. It looks like that should blow up. It doesn't, because a delta is defined by its area, not its height — and area is what a rate equation integrates."},
        {t:"p",v:"Think of a spike as a rectangular pulse of width ε and height h. During the pulse the current rises by roughly h·ε, which is the pulse's area. Now shrink ε toward zero while raising h to keep the area fixed at W. The pulse becomes infinitely tall and infinitely narrow, and the current still rises by exactly W. Only the sharpness changes."},
        {t:"widget",v:"delta"},
        {t:"p",v:"Formally: integrate the equation across a sliver of time around the spike. The decay term vanishes, because a finite quantity integrated over a shrinking window goes to zero. The delta term does not, because its area stays at 1 however narrow the window gets. What survives is a jump of exactly W."},
        {t:"p",v:"Honestly, the discrete form makes this obvious without any of that. S[n] is just 0 or 1, so the sum is nothing more than \"add up the weights of whichever inputs fired.\" The delta notation is how you write that same idea when time is continuous."},

        {t:"h",v:"The reset, and a discrepancy worth knowing"},
        {t:"p",v:"The −S[n] term is the reset. If the neuron fired, subtract 1; otherwise subtract nothing. Note the subscript: this is the neuron's <strong>own</strong> output, not an input. Same symbol, different neuron, and an easy thing to blur when writing fast."},
        {t:"p",v:"It is written as a subtraction rather than an assignment, which makes it a <strong>soft reset</strong>. If the voltage overshot to 1.08, subtraction leaves 0.08 behind; an assignment would discard it. Lava's CUBA implementation uses a hard reset instead, zeroing the voltage outright."},
        {t:"widget",v:"reset"},
        {t:"p",v:"At low input the two barely differ. Push the input higher and they separate, with different spike counts. So this is not a detail you can wave away if your paper says one thing and your code does the other."},

        {t:"h",v:"Why this is secretly a recurrent network"},
        {t:"p",v:"Look at what the state depends on. I[n+1] depends on I[n]. U[n+1] depends on U[n]. Every neuron carries state forward in time entirely on its own. That is the definition of a recurrent network, which means the whole thing unrolls in time and trains with backpropagation through time."},
        {t:"p",v:"This holds even with no recurrent weights between neurons. There are two separate kinds of recurrence here: the explicit kind, where neurons in a layer talk to each other through a square weight matrix, and the implicit kind that lives inside each neuron's own state. Dropping the first does not remove the second."},
        {t:"note",class:"warn",v:"<p><b>Where training breaks.</b> The spike function is a step, so its derivative is zero almost everywhere and undefined at the threshold. Backpropagation through it kills the gradient entirely. The fix is a surrogate gradient: substitute a smooth function's derivative in the backward pass only, leaving the forward pass a true binary spike.</p>"},

        {t:"h",v:"One trap if you use Lava"},
        {t:"p",v:"Lava's <code>current_decay</code> is the fraction that <strong>leaks away</strong>, not the fraction retained. The paper's α is the fraction retained. So they are opposites, and mixing them will make you state your time constants backwards."},
        {t:"eq",v:"α = 1 − current_decay\nτ = −Δt / ln(1 − current_decay)"},
        {t:"tbl",v:[["current_decay","retained (paper's α)","τ in units of Δt"],["0.10","0.90","≈ 9.5"],["0.25","0.75","≈ 3.5"],["0.50","0.50","≈ 1.4"],["1.00","0.00","0 — no memory at all"]]},
        {t:"p",v:"That last row matters. Setting <code>current_decay = 1</code> removes the current stage entirely, which means you are running a plain LIF and not CUBA at all. Worth checking your config before claiming otherwise."}
      ],
      quiz:[
        {q:"In I[n+1] = α·I[n] + Σ W·S[n], what does the sum actually compute at a given step?",
         o:["The average firing rate of the layer below","The sum of the weights of only those inputs that fired at step n","The weighted sum of the membrane voltages below","The number of input neurons connected"],a:1,
         h:"S[n] is either 0 or 1.",
         e:"Since S[n] is 0 or 1, each term is either nothing or the full weight. The sum is a tally of the weights of whoever fired. Voltages from the layer below never enter — only their spikes do."},
        {q:"In U[n+1] = β·U[n] + I[n] − S[n], whose spike is being subtracted?",
         o:["The spikes of the layer below","The spikes of neighbouring neurons in the same layer","The neuron's own output spike","The spike of the readout layer"],a:2,
         h:"What is this term physically doing to the neuron?",
         e:"This is the reset. When a neuron fires, its own voltage drops back toward rest, so the subscript here is i, not j. Worth double-checking every time you write the equation out."},
        {q:"A colleague says a spike from the layer below raises this neuron's voltage directly. In a CUBA model, is that right?",
         o:["Yes, that is what the weight does","No — the spike raises the current first, which then charges the voltage","Yes, but only for positive weights","No — spikes only affect the threshold"],a:1,
         h:"Which equation do the weights W appear in?",
         e:"W appears in the current equation, not the voltage equation. The spike jumps I, and I feeds U on the next step. Two leaky stages in series. In a plain LIF the spike would indeed hit the voltage directly."},
        {q:"You increase τ_mem. What happens to β, and what does that do to the neuron?",
         o:["β shrinks; the neuron forgets faster","β grows; the neuron holds onto past input longer","β is unchanged; τ_mem only affects the threshold","β grows; the neuron fires less regardless of input"],a:1,
         h:"A larger τ makes the exponent closer to zero.",
         e:"A bigger τ_mem pushes the exponent toward 0, so β moves toward 1. Since β is the fraction retained each step, a β near 1 means very little leaks away — a long memory."},
        {q:"Your Lava config has current_decay = 0.1. What is the paper's α?",
         o:["0.1","0.9","10","exp(−0.1)"],a:1,
         h:"Lava's decay is the fraction lost, not the fraction kept.",
         e:"Lava's current_decay is what leaks away, so the retained fraction is 1 − 0.1 = 0.9. A small current_decay means a LONG memory, the opposite of what a small α would mean."},
        {q:"Your network has no recurrent weights between neurons. Is it still a recurrent network?",
         o:["No — without them it is purely feedforward","Yes — I and U carry state forward in time inside every neuron","Only if τ_mem is large enough","Only during training"],a:1,
         h:"Look at what I[n] and U[n] depend on.",
         e:"Two kinds of recurrence. The explicit kind between neurons is the V term. The implicit kind lives in each neuron's own state: I[n+1] depends on I[n], U[n+1] on U[n]. That persists regardless, so the network still unrolls in time and still needs BPTT."},
        {q:"Why does S[n] = Θ(U[n] − ϑ) cause a problem for training?",
         o:["It is too slow on a GPU","Its derivative is zero almost everywhere, so gradients cannot flow","It makes the network non-deterministic","It forces the voltage negative"],a:1,
         h:"What is the slope of a step function?",
         e:"A step is flat everywhere except at the threshold, where it is undefined. Flat means zero derivative, so backpropagation through it kills the gradient. The fix is a surrogate gradient in the backward pass only."}
      ],
      cards:[
        {f:"The current update",b:"<span class='k'>I[n+1] = α·I[n] + Σ W·S[n]</span>Keep most of the old current, then add the weights of whoever just spiked."},
        {f:"The voltage update",b:"<span class='k'>U[n+1] = β·U[n] + I[n] − S[n]</span>Keep most of the old voltage, add the current, and if you just fired, subtract 1."},
        {f:"The spike condition",b:"<span class='k'>S[n] = Θ(U[n] − ϑ)</span>Fire if the voltage reached threshold. Θ outputs 1 when the inside is ≥ 0."},
        {f:"What does α mean, and where does it come from?",b:"<span class='k'>α = exp(−Δt / τ_syn)</span>The fraction of synaptic current that survives one timestep. Always between 0 and 1. Bigger τ_syn gives bigger α, meaning a longer memory."},
        {f:"What does β mean, and where does it come from?",b:"<span class='k'>β = exp(−Δt / τ_mem)</span>The fraction of membrane voltage that survives one timestep. τ_mem is the neuron's memory span."},
        {f:"What does \"current-based\" (CUBA) actually mean?",b:"A spike does not touch the membrane voltage directly. It jumps a synaptic current, and the current then charges the membrane. Two leaky stages in series, with two separate time constants."},
        {f:"Plain LIF versus CUBA in one sentence",b:"Plain LIF is the τ_syn → 0 limit of CUBA. Same model, with the instantaneous-synapse assumption relaxed."},
        {f:"Where does the voltage settle under constant input?",b:"<span class='k'>U = U_rest + R·I</span>The point where the leak exactly cancels the drive. The neuron only ever fires if R·I exceeds the threshold."},
        {f:"Why does a Dirac delta produce a finite jump?",b:"A delta is defined by its area, not its height. Integrating the equation across the spike, the decay term vanishes but the delta contributes its full area — a jump of exactly W."},
        {f:"Is an SNN with no recurrent weights still an RNN?",b:"Yes. I[n+1] depends on I[n] and U[n+1] on U[n], so every neuron carries state forward in time on its own. Explicit recurrence between neurons is a separate thing."},
        {f:"Where exactly does training break, and what fixes it?",b:"At the spike function. A step has zero derivative almost everywhere, so gradients cannot flow back through it. A surrogate gradient substitutes a smooth derivative in the backward pass only."},
        {f:"Lava's decay convention",b:"<span class='k'>α = 1 − current_decay</span>Lava's value is the fraction that leaks AWAY, the paper's α is the fraction retained. A small current_decay means a long memory."},
        {f:"Soft reset versus hard reset",b:"Soft subtracts the threshold, carrying any overshoot forward. Hard sets the voltage to zero, discarding it. The paper writes a soft reset; Lava's CUBA implements a hard one."}
      ]
    },{
      id:"day3", n:"Day 3", title:"Surrogate gradients",
      blurb:"The spike function has no usable derivative. Here is the substitution that lets these networks train anyway.",
      notes:[
        {t:"h",v:"The problem, stated plainly"},
        {t:"p",v:"An SNN needs its spikes to be binary. That is the whole point — sparse, event-driven, 0 or 1. But a binary output comes from a step function, and a step function has no derivative worth using."},
        {t:"p",v:"Two things go wrong at once. Away from the threshold the step is perfectly flat, so its slope is <strong>zero</strong>. At the threshold it jumps, so its slope is <strong>undefined</strong> — formally a Dirac delta, infinitely tall."},
        {t:"eq",v:"S = Θ(U − ϑ)     →     Θ′ = 0  almost everywhere\n<em>and a product with one zero factor in it is zero</em>"},
        {t:"p",v:"That second line is the fatal part. Backpropagation multiplies derivatives along a chain. A single zero anywhere in that product wipes out everything, so no weight anywhere in the network receives a gradient. The model cannot learn at all."},

        {t:"h",v:"The trick: let the two passes disagree"},
        {t:"p",v:"Here is the move. The forward pass and the backward pass do not have to use the same function. Nothing enforces consistency between them — autograd simply looks up whatever derivative you registered for an operation."},
        {t:"p",v:"So the forward pass keeps its hard step, producing real binary spikes. The backward pass pretends the step was smooth and uses that pretend function's derivative instead. The network trains as if it were continuous while behaving as if it were discrete."},
        {t:"widget",v:"surro"},
        {t:"p",v:"The top curve never moves. That is the forward pass, unchanged no matter what happens below. The bumps underneath are candidates for the backward pass. Drag the width and watch them all collapse toward an infinitely narrow spike — that narrow limit is the true derivative, and it is exactly what you are trying to avoid."},
        {t:"p",v:"What matters is what the shapes have in common, not how they differ. Each is centred at the threshold, largest there, and fades away on both sides. The message to the network is identical in every case: <strong>a neuron that nearly fired, or nearly did not, is the one whose weights are worth adjusting.</strong> A neuron sitting far from threshold gets almost nothing, because nudging its weights would not have changed its output anyway."},
        {t:"note",v:"<p><b>Width matters more than shape.</b> This is one of the paper's main empirical claims, and it is a little surprising. Rectangular, sigmoid-derivative and arctan all work about as well. How wide the window is turns out to matter considerably more than which curve you picked.</p>"},

        {t:"h",v:"The substitution, in the chain rule"},
        {t:"p",v:"Write out backpropagation for a single weight and the fix becomes almost anticlimactic. The gradient travels from the loss, through the spike, through the voltage, through the current, and finally into the weight:"},
        {t:"eq",v:"∂L/∂W  =  ∂L/∂S · ∂S/∂U · ∂U/∂I · ∂I/∂W\n<em>every factor is an ordinary derivative — except the second</em>"},
        {t:"p",v:"Three of those four factors are derivatives of plain linear operations, and they behave themselves. The offender is ∂S/∂U, which is Θ′ and equals zero. So one factor gets swapped:"},
        {t:"eq",v:"∂S/∂U  =  Θ′(U − ϑ)   →   σ′(U − ϑ)"},
        {t:"p",v:"<strong>Nothing else in the chain changes.</strong> That is the sentence to be able to say without looking. BPTT itself is untouched. The unrolled graph is untouched. The loss is untouched. One factor gets a stand-in and everything else runs as normal."},

        {t:"h",v:"The second approximation, which is easy to miss"},
        {t:"p",v:"Most people remember the surrogate and forget this one. The reset term also depends on the spike, so it too carries a Θ′ and contributes to the gradient. In practice that path is usually <strong>dropped entirely</strong> from the backward pass."},
        {t:"p",v:"The justification is that reset is a correction rather than the main signal path, and including it tends to destabilise training more than it helps. But it is an approximation, and it is worth naming as one rather than pretending the derivation is exact."},
        {t:"note",class:"warn",v:"<p><b>Two approximations, not one.</b> Surrogate for Θ′, and the reset path dropped. If you are asked how the gradient gets through the spike, both belong in the answer.</p>"},

        {t:"h",v:"Credit across time"},
        {t:"p",v:"Because the network is unrolled in time, the gradient does not only travel down through layers. It also travels <strong>backwards through timesteps</strong>. A spike at step 3 changed the voltage at step 4, which changed whether a spike happened at step 5, which affected the loss."},
        {t:"p",v:"SLAYER calls this <strong>error reassignment in time</strong>. An error measured at the end of a sequence gets distributed back to the earlier spikes that caused it, spread according to the spike response kernel rather than assigned to one instant."},
        {t:"p",v:"This is also why the loss is summed over the whole sequence rather than read off a single step:"},
        {t:"eq",v:"L = Σ_t  ℓ(s_t, y)\n<em>every timestep contributes, so every timestep receives gradient</em>"},

        {t:"h",v:"What this means for a real implementation"},
        {t:"p",v:"SLAYER does not use any of the three shapes from the paper's figure. It uses a <strong>decaying exponential</strong> — same family, a bump centred on threshold, but with a sharp peak instead of a rounded one."},
        {t:"eq",v:"σ′(U) = (scale_grad / 2ρ) · exp(−|U − ϑ| / ρ)\nρ = tau_grad × ϑ"},
        {t:"p",v:"<code>tau_grad</code> is the width slider from the diagram above. It decides how far from threshold a neuron can sit and still receive gradient, and the default is 1."},
        {t:"tbl",v:[["|U − ϑ|","tau_grad = 0.001","tau_grad = 1"],["0.001","184","0.50"],["0.005","3.4","0.50"],["0.01","0.023","0.50"],["0.05","0.0000000000000000001","0.48"]]},
        {t:"p",v:"At 0.001 only neurons within roughly ±0.005 of threshold learn anything at all, while the few sitting exactly at threshold receive gradients in the hundreds. Near-nothing for most and enormous for a handful is a recipe for training that stalls or blows up. Worth checking in your own config before assuming it is fine."},
        {t:"note",v:"<p><b>The one-line takeaway.</b> The surrogate gradient decides which neurons receive credit. Too narrow and almost none of them do.</p>"},

        {t:"h",v:"Eqs. (10)–(12): the chain rule, written out step by step"},
        {t:"p",v:"Neftci's page 18 does the same thing forward in time, for one weight W_ij. Differentiate each LIF line and read them bottom-up: (12) feeds (11), (11) feeds (10)."},
        {t:"eq",v:"(12)  ∂I[n+1]/∂W = α·∂I[n]/∂W + S_j[n]\n<em>current sensitivity: decayed old value plus the input spike</em>"},
        {t:"eq",v:"(11)  ∂U[n+1]/∂W = β·∂U[n]/∂W + ∂I[n]/∂W − ∂S[n]/∂W\n<em>voltage sensitivity: decayed old value plus current sensitivity minus the reset</em>"},
        {t:"eq",v:"(10)  ∂S[n+1]/∂W = Θ′(U[n+1] − ϑ) · ∂U[n+1]/∂W\n<em>through the spike: this is where Θ′ appears</em>"},
        {t:"p",v:"Apply the same two approximations: Θ′ becomes σ′, and the reset term −∂S/∂W is dropped. What is left is striking: ∂U/∂W is just the input spike train filtered twice, first by α and then by β. A PSP-shaped trace that depends only on presynaptic activity."},
        {t:"eq",v:"∂U/∂W ≈ ε * S_j\n<em>W drops out because the current is linear in W</em>"},
        {t:"tbl",v:[["n","S_j[n]","∂I/∂W","∂U/∂W"],["0","1","0","0"],["1","0","1","0"],["2","0","0.5","1"],["3","0","0.25","1.3"]]},
        {t:"p",v:"That table uses α = 0.5, β = 0.8 and one input spike at n = 0. Notice the one-step delay at each stage: the spike reaches the current at n = 1 and the voltage at n = 2."},
        {t:"note",v:"<p><b>Why no ∂S_j/∂W term in (12)?</b> S_j is input data, so it cannot depend on W. Not because it is binary. In a deeper or recurrent net that term would appear and things become non-local.</p>"},
        {t:"note",class:"warn",v:"<p><b>σ′ gates the trace.</b> Eq. (10) is a product. A large trace times a tiny σ′ (voltage far from threshold) is still almost zero. No credit to neurons that were nowhere near firing.</p>"},

        {t:"h",v:"SLAYER's backward rule, in one line"},
        {t:"eq",v:"δ⁽ˡ⁾(t) = ρ(t) · ( ε ⊙ (Wᵀ δ⁽ˡ⁺¹⁾) )(t)\n<em>Wᵀ: back across layers.  ε ⊙: back in time.  ρ: only near threshold.</em>"},
        {t:"p",v:"Spikes just before an error get the most blame, older ones less, and later ones none, because the future cannot cause the past. It is BPTT in spirit, so memory grows with T."},

        {t:"h",v:"How a count loss still has a gradient"},
        {t:"p",v:"For classification the loss compares spike counts: the true class should fire a lot, the others little. A count is an integer, but the count itself is never differentiated. The error (count − target) is spread evenly over all T steps. At each step it passes through the smooth surrogate, which keeps the near-threshold moments, near-misses included. Then the kernel sends it back to the input spikes that caused them."},
        {t:"eq",v:"too many spikes  →  weights go down\ntoo few spikes   →  weights go up"},

        {t:"h",v:"My model, mapped"},
        {t:"tbl",v:[["code","meaning"],["slayer.block.cuba","CUBA-LIF neurons"],["current_decay 0.3","α ≈ 0.7"],["voltage_decay 0.25","β ≈ 0.75"],["threshold 1","ϑ = 1"],["tau_grad 1","width of SLAYER's exponential surrogate"],["requires_grad True","decays are learned, and federated-averaged"],["delay False","SLAYER's learnable delays are off"]]}
      ],
      quiz:[
        {q:"Why is Θ′ zero almost everywhere?",
         o:["Because the threshold is set to 1","Because a step function is perfectly flat on both sides of the jump","Because spikes are sparse in time","Because the voltage decays between spikes"],a:1,
         h:"Picture the shape of a step and ask what its slope is.",
         e:"A step is horizontal everywhere except at the single point where it jumps. A horizontal line has slope zero, so the derivative is zero on both sides."},
        {q:"Why is a zero derivative fatal rather than merely inconvenient?",
         o:["It makes the forward pass slower","Backpropagation multiplies derivatives, so one zero factor zeroes the whole chain","It forces the voltage to go negative","It makes the loss undefined"],a:1,
         h:"What operation does the chain rule perform on the factors?",
         e:"The chain rule is a product. A single zero anywhere in that product makes the result zero, so no weight in the network receives any gradient and nothing learns."},
        {q:"In the surrogate gradient method, what happens to the forward pass?",
         o:["It uses a smooth sigmoid instead of a step","It is unchanged — still a hard binary spike","It is skipped during training","It uses the surrogate only on the first epoch"],a:1,
         h:"What would you lose if the forward pass stopped being binary?",
         e:"Only the backward pass is substituted. The forward pass keeps its hard step, because binary spikes are what give an SNN its sparsity and event-driven efficiency. Smooth it and you have a rate network with extra steps."},
        {q:"What do rectangular, sigmoid-derivative and arctan surrogates have in common?",
         o:["They are all exactly equal to Θ′","They are bumps centred at the threshold, largest there and decaying away","They all require a learnable width","They all output binary values"],a:1,
         h:"Think about where each one is biggest.",
         e:"All three say the same thing: neurons near threshold are the ones worth adjusting, because they are the ones whose output a small weight change could have flipped. The paper finds the exact shape matters much less than the width."},
        {q:"Which single factor in the BPTT chain rule gets replaced?",
         o:["∂L/∂S","∂S/∂U","∂U/∂I","∂I/∂W"],a:1,
         h:"Which factor involves the spike function?",
         e:"Only ∂S/∂U, the derivative of the spike with respect to the voltage. The other three are derivatives of linear operations and behave normally. BPTT, the unrolled graph and the loss are all untouched."},
        {q:"Besides the surrogate, what second approximation is usually made?",
         o:["The leak term is set to zero","The reset path is dropped from the backward pass","The threshold is made learnable","The loss is computed only at the last timestep"],a:1,
         h:"What else in the equations depends on the spike?",
         e:"The reset also depends on S, so it carries a Θ′ too. That path is normally dropped, on the grounds that it is a correction rather than the main signal and tends to destabilise training. It is an approximation, and worth naming as one."},
        {q:"What does SLAYER mean by \"error reassignment in time\"?",
         o:["Rescaling the loss by the number of timesteps","Distributing an error back to the earlier spikes that caused it","Shifting spikes forward to align with labels","Resetting the gradient at each timestep"],a:1,
         h:"The network is unrolled in time — where else can gradient flow?",
         e:"Gradient flows backwards through timesteps as well as down through layers. An error at the end of a sequence is assigned back to earlier spikes that contributed to it, spread by the spike response kernel rather than pinned to one instant."},
        {q:"Your tau_grad was 0.001 and you changed it to 1. What did that change?",
         o:["The firing threshold moved","The learning window widened by a factor of about a thousand","The membrane time constant grew","The network became feedforward"],a:1,
         h:"tau_grad sets ρ, which is the width of the surrogate.",
         e:"ρ = tau_grad × ϑ is the width of the exponential surrogate. At 0.001 only neurons within about ±0.005 of threshold received any gradient. At 1, essentially all of them do."},
        {q:"Why is there no ∂S_j/∂W term in Eq. (12)?",
         o:["Because S_j is binary","Because α cancels it","Because it is dropped as an approximation","Because S_j is input data and does not depend on W"],a:3,
         h:"Where do the input spikes come from in a two-layer net?",
         e:"S_j is the input layer, fixed by the data. Changing W_ij cannot change it. Being 0/1 is not the reason."},
        {q:"With the reset dropped, ∂U/∂W depends only on…",
         o:["Input j's spikes, filtered twice (ε * S_j)","The weight W itself","The target spike train","Neuron i's own output spikes"],a:0,
         h:"Is the current linear in W?",
         e:"The current is W times a presynaptic trace, so its derivative drops W. Filtering by α then β gives a PSP-shaped trace of input j's spikes."},
        {q:"A neuron's voltage trace is large but its voltage was far below threshold. What is ∂S/∂W with the surrogate?",
         o:["Large, because the trace is large","Exactly equal to the trace","Close to 0, because σ′ is tiny there","Undefined"],a:2,
         h:"Eq. (10) is a product.",
         e:"σ′ gates the trace. Far from threshold σ′ ≈ 0, so the product is ≈ 0 no matter how big the trace is."},
        {q:"In SLAYER, an error happens at t = 26. Input spikes are at 20, 22 and 33. Which gets zero blame?",
         o:["t = 20","t = 33","t = 22","None, all share equally"],a:1,
         h:"Can the future cause the past?",
         e:"The kernel is zero for negative time. A spike after the error could not have caused it, so it gets no blame."},
        {q:"A count loss says 9 spikes, target 6. What does the gradient do, and why does it exist?",
         o:["Nothing, counts are integers so there is no gradient","Weights go up, because the error is positive","Weights go down; the error flows through the smooth surrogate at every step","Only the last time step is updated"],a:2,
         h:"The count isn't differentiated directly.",
         e:"The error is spread over all steps and passes through the surrogate, which is smooth. Too many spikes means the weights are pushed down."}
      ],
      cards:[
        {f:"Why is Θ′ zero almost everywhere?",b:"A step function is perfectly flat on both sides of its jump, and a flat line has slope zero."},
        {f:"Why is Θ′ undefined at the threshold?",b:"The function jumps instantaneously, so there is no finite slope there. Formally the derivative is a Dirac delta — infinitely tall, zero width."},
        {f:"Why does a zero derivative stop all learning?",b:"The chain rule multiplies derivatives together. One zero factor makes the entire product zero, so no weight anywhere in the network receives a gradient."},
        {f:"What is the surrogate gradient trick, in one sentence?",b:"Keep the hard binary step in the forward pass, but substitute a smooth function's derivative in the backward pass. Nothing requires the two passes to agree."},
        {f:"Why not just use a smooth function in the forward pass too?",b:"You would lose binary spikes, and with them the sparsity and event-driven efficiency that justify using an SNN at all. That is a rate network with extra steps."},
        {f:"Name three surrogate shapes from the paper",b:"Rectangular, the derivative of a sigmoid, and the derivative of an arctan. SLAYER uses a fourth: a decaying exponential."},
        {f:"What do all surrogate shapes have in common?",b:"Each is a bump centred at the threshold, largest there and decaying away on both sides. They all say: neurons near threshold are the ones worth adjusting."},
        {f:"Shape or width — which matters more?",b:"Width. The paper's empirical finding is that the specific curve matters much less than how wide the learning window is."},
        {f:"Write the BPTT chain for one weight",b:"<span class='k'>∂L/∂W = ∂L/∂S · ∂S/∂U · ∂U/∂I · ∂I/∂W</span>Three factors are ordinary derivatives of linear operations. Only ∂S/∂U is the problem."},
        {f:"Which single factor gets substituted?",b:"<span class='k'>∂S/∂U : Θ′ → σ′</span>Nothing else changes. BPTT, the unrolled graph and the loss are all untouched."},
        {f:"What are the TWO approximations?",b:"First, Θ′ is replaced by a surrogate σ′. Second, the reset path is dropped from the backward pass. Most people remember the first and forget the second."},
        {f:"Why is the reset path dropped?",b:"It is a correction rather than the main signal path, and including it tends to destabilise training. It is an approximation, not an exact derivation."},
        {f:"What is \"error reassignment in time\"?",b:"Distributing an error measured late in a sequence back to the earlier spikes that caused it, spread by the spike response kernel rather than pinned to one instant."},
        {f:"How does the loss aggregate over time?",b:"<span class='k'>L = Σ_t ℓ(s_t, y)</span>Every timestep contributes to the loss, so every timestep receives gradient."},
        {f:"SLAYER's surrogate function",b:"<span class='k'>σ′(U) = (scale_grad / 2ρ) · exp(−|U − ϑ| / ρ)</span>with ρ = tau_grad × ϑ. A sharp-peaked exponential rather than a rounded bump."},
        {f:"What does tau_grad control, and what is its default?",b:"The width of the learning window around the threshold. Default is 1. At 0.001 only neurons within about ±0.005 of threshold receive any gradient at all."},
        {f:"The one-line takeaway for Day 3",b:"The surrogate gradient decides which neurons receive credit. Too narrow and almost none of them do."},
        {f:"Eqs. (10)–(12)",b:"<span class='k'>∂I[n+1] = α∂I[n] + S_j[n]<br>∂U[n+1] = β∂U[n] + ∂I[n] − ∂S[n]<br>∂S[n+1] = Θ′·∂U[n+1]</span>Replace Θ′ with σ′, and drop the reset term."},
        {f:"With the reset dropped, what does ∂U/∂W depend on?",b:"<span class='k'>∂U/∂W ≈ ε * S_j</span>Only input j's spikes, filtered by α then β. W drops out because the current is linear in W."},
        {f:"What does σ′ do in Eq. (10)?",b:"It gates the trace. Far from threshold σ′ ≈ 0, so the gradient is ≈ 0 even if the trace is large."},
        {f:"How can a count loss train an SNN?",b:"The error (count − target) is spread over all T steps, passes through the smooth surrogate (near-threshold moments, near-misses too), then the kernel sends it back to the causing inputs."},
        {f:"SuperSpike versus SLAYER",b:"SuperSpike: forward traces in time, random feedback across layers, local and online. SLAYER: errors backward in time, exact backprop across layers, memory grows with T."},
        {f:"30-second answer: why does this work if it's non-differentiable?",b:"The forward pass stays truly spiking. In the backward pass we swap Θ′ for a smooth function peaked at threshold, giving credit to neurons that were close to firing. It's a biased but useful gradient, and many shapes work."}

      id:"day5", n:"Day 5", title:"FedAvg from first principles",
      blurb:"McMahan et al. 2017: the federated objective, FedSGD versus FedAvg, Algorithm 1, and what K, C, E, B and η each do.",
      notes:[
        {t:"h",v:"The paper"},
        {t:"p",v:"<strong>McMahan, Moore, Ramage, Hampson and Agüera y Arcas, \"Communication-Efficient Learning of Deep Networks from Decentralized Data\", AISTATS 2017.</strong> It introduced FederatedAveraging. Reference [14] in my paper. Free on arXiv as 1602.05629."},
        {t:"h",v:"Why federated learning at all"},
        {t:"p",v:"Phones hold rich, private data. Instead of uploading it, each client trains locally and sends only an <strong>update to the current global model</strong>. The server combines the updates. Raw data never leaves the device."},
        {t:"p",v:"Federated optimization differs from data-centre training in four ways: data is <strong>non-IID</strong>, <strong>unbalanced</strong>, <strong>massively distributed</strong>, and <strong>communication is limited</strong>. On a phone, computation is almost free but upload bandwidth is 1 MB/s or less. So the goal is to spend more computation to need fewer rounds."},
        {t:"note",class:"warn",v:"<p><b>Is it private?</b> FL keeps raw data local and sends minimal, ephemeral updates that cannot contain more information than the data. It does <b>not</b> guarantee privacy, and updates can still leak information. My paper makes no formal privacy claim.</p>"},
        {t:"h",v:"The objective: a weighted sum of client losses"},
        {t:"eq",v:"f(w) = (1/n) Σᵢ fᵢ(w)\n<em>ordinary training: the average loss over all n examples</em>"},
        {t:"eq",v:"f(w) = Σₖ (nₖ / n) · Fₖ(w),     Fₖ(w) = (1/nₖ) Σ_{i ∈ 𝒫ₖ} fᵢ(w)\n<em>the same number, computed client by client</em>"},
        {t:"p",v:"Average within each client first, then combine clients weighted by their share of the data. The weights make every <strong>example</strong> count equally, not every client."},
        {t:"tbl",v:[["client","examples","losses","Fₖ","nₖ/n"],["A","2","1, 3","2","0.2"],["B","3","2, 2, 5","3","0.3"],["C","5","1, 1, 1, 1, 6","2","0.5"]]},
        {t:"p",v:"All ten examples together: 23 / 10 = 2.3. Weighted by client: 0.2·2 + 0.3·3 + 0.5·2 = 2.3. A plain average of the clients would give 2.33, which is wrong."},
        {t:"p",v:"<strong>IID</strong> means 𝔼[Fₖ(w)] = f(w): with a random split, each client's loss is on average the global loss. <strong>Non-IID</strong> means Fₖ can be an arbitrarily bad approximation of f. With my equal IID shards, nₖ/n = 1/K for every client, so the weighted average becomes a plain average."},
        {t:"h",v:"From FedSGD to FedAvg"},
        {t:"p",v:"<strong>FedSGD:</strong> each selected client computes one gradient on all its local data, gₖ = ∇Fₖ(wₜ). The server takes one step with the weighted sum:"},
        {t:"eq",v:"wₜ₊₁ = wₜ − η Σₖ (nₖ/n) gₖ"},
        {t:"p",v:"The key rewrite: the same update can be done as each client stepping itself, wᵏ = wₜ − η gₖ, and the server <strong>averaging the models</strong>. Once written that way, a client can take many steps before averaging. That is <strong>FedAvg</strong>."},
        {t:"eq",v:"wₜ₊₁ = Σₖ (nₖ/n) · wₜ₊₁ᵏ\n<em>average the weights, not the gradients</em>"},
        {t:"tbl",v:[["knob","meaning","my paper"],["K","total clients","2, 4, 8"],["C","fraction of clients per round","1 (all)"],["E","local epochs per round","2, 4, 8"],["B","local batch size (∞ = whole local set)","32, 64, 128"],["η","learning rate","0.001"]]},
        {t:"eq",v:"uₖ = E · nₖ / B        local updates per round\nFedSGD = FedAvg with E = 1, B = ∞  (one step per round)"},
        {t:"h",v:"Algorithm 1 in plain words"},
        {t:"eq",v:"Server:  initialise w₀\n         each round t:  m = max(C·K, 1);  pick Sₜ (m random clients)\n                        every k in Sₜ in parallel:  wₜ₊₁ᵏ = ClientUpdate(k, wₜ)\n                        wₜ₊₁ = Σₖ (nₖ/n) wₜ₊₁ᵏ\nClient:  split 𝒫ₖ into batches of size B\n         for E epochs, for each batch b:  w ← w − η ∇ℓ(w; b)\n         return w"},
        {t:"h",v:"Why averaging models does not break (their Figure 1)"},
        {t:"p",v:"Two MNIST models trained on different data were mixed as θw + (1 − θ)w′. With <strong>different</strong> random initialisations, the average is a loss spike. With the <strong>same</strong> initialisation, ½w + ½w′ has lower loss than either parent. FedAvg is safe because every client starts each round from the same wₜ."},
        {t:"h",v:"Why averaging K models is not K times the steps"},
        {t:"p",v:"Clients step in parallel from the same start, each on its own data, and their models are averaged. One model taking K times the steps would take them one after another, each building on the last. A one-number example: two clients pull toward 2 and 4, η = 0.5, two local steps each, start at 0."},
        {t:"tbl",v:[["approach","total steps","result after one round"],["FedAvg (2 clients × 2 steps)","4","2.25"],["one model, 4 steps in a row","4","2.8125"]]},
        {t:"p",v:"FedAvg's round equals two sequential steps, not four. Averaging gives about one client's path, which is why more clients (less data each, fewer steps) means less progress per round, and more local epochs helps."},
        {t:"widget",v:"fedavg"},
        {t:"h",v:"Their E and B experiments (Table 2, Figure 2)"},
        {t:"p",v:"With C = 0.1, adding local computation cut communication dramatically. MNIST CNN, IID, target 99%: FedSGD needed <strong>626 rounds</strong>; E = 20, B = 10 needed <strong>18 (about 35×)</strong>. Shakespeare LSTM, non-IID: up to <strong>95×</strong>. Lower B first: it is nearly free on parallel hardware."},
        {t:"p",v:"Caveats: gains are smaller for pathological non-IID MNIST (2.8–3.7×), and one setting (non-IID, E = 5, B = ∞) needed 1000 rounds, <strong>slower</strong> than FedSGD's 483. Very large E can plateau or diverge (their Figure 3), so reduce local work late in training."},
        {t:"h",v:"How my results compare"},
        {t:"tbl",v:[["effect","McMahan","my paper (rounds to 70%)"],["more local epochs E","fewer rounds","E 2 → 8: 17 → 6 (K = 2), 29 → 11 (K = 4)"],["batch size B","smaller B faster","larger B faster: 11 → 7 → 6 for B = 32, 64, 128"]]},
        {t:"p",v:"A plausible reason for the B difference: I used a fixed η = 0.001 with surrogate-gradient SNNs, so larger batches mean less gradient noise. McMahan tuned η for every setting."},
        {t:"note",v:"<p><b>Related-work sentence.</b> Consistent with McMahan et al. [14], who showed that more local computation per round sharply reduces communication rounds, raising E from 2 to 8 reaches 70% accuracy in roughly 2.5–3× fewer rounds. Unlike their results, larger local batches converged faster in our spiking setting, likely because they reduce gradient noise under a fixed learning rate.</p>"}
      ],

      id:"day6", n:"Day 6", title:"Client drift, non-IID and the Flower framework",
      blurb:"When FedAvg struggles, the standard fixes (FedProx, SCAFFOLD), and one Flower round traced through my own code.",
      notes:[
        {t:"h",v:"When FedAvg struggles: client drift"},
        {t:"p",v:"With non-IID data, every client's local optimum sits somewhere different. Many local steps pull each client toward <strong>its own</strong> optimum, so the averaged model lands near the average of the client optima instead of the true global optimum. That gap is <strong>client drift</strong>. More local steps and more skewed data both make it worse."},
        {t:"widget",v:"drift"},
        {t:"p",v:"Set non-IID strength to 0 and the client optima collapse onto the global one: no drift. That is my paper's IID setting. Push it to 1 with many local steps and FedAvg settles visibly off-target. FedProx shortens the client paths; SCAFFOLD steers them back to the true optimum. (A toy with bowl-shaped losses; real SNN losses are more complex, but the mechanism is the same.)"},
        {t:"h",v:"Zhao et al. 2018: weight divergence"},
        {t:"p",v:"<strong>\"Federated Learning with Non-IID Data\"</strong> [24]. Under highly skewed splits, FedAvg loses accuracy: <strong>up to 11% on MNIST, 51% on CIFAR-10 and 55% on keyword spotting</strong>. Harder tasks suffer more."},
        {t:"eq",v:"weight divergence = ‖w_FedAvg − w_SGD‖ / ‖w_SGD‖\n<em>how far the federated model drifts from centralized SGD, same initialization</em>"},
        {t:"p",v:"The root cause is the <strong>earth mover's distance</strong> between each client's class distribution and the population's. In their '1-class non-IID' setting each client holds only one class; in '2-class', two. Their fix is a small globally shared, class-balanced dataset: about <strong>5% shared data gave roughly +30% on CIFAR-10</strong>. The catch: sharing data partly conflicts with keeping data local."},
        {t:"h",v:"Li et al. 2020: the four challenges"},
        {t:"p",v:"<strong>\"Federated Learning: Challenges, Methods, and Future Directions\"</strong> [11] names four challenges: <strong>expensive communication, systems heterogeneity, statistical heterogeneity, and privacy</strong>."},
        {t:"tbl",v:[["term","means","memory trick"],["statistical heterogeneity","clients' data is non-IID","statistical = data"],["systems heterogeneity","devices differ in storage, compute, network; few active at once","systems = hardware"]]},
        {t:"p",v:"Section 2.3.2: classical parallel-SGD analyses assume every local solver is a copy of the same stochastic process, which the non-IID setting breaks. FedAvg has been shown to <strong>diverge</strong> in practice on heterogeneous data. Heuristic fixes that share device or proxy data may violate privacy assumptions. Open gap: few analyses allow realistic <strong>low participation</strong> or <strong>dropped devices</strong>."},
        {t:"h",v:"FedProx: a proximal term"},
        {t:"eq",v:"client k minimizes   F_k(w) + (μ/2) ‖w − w_t‖²\n<em>local loss plus a penalty for moving away from the global model</em>"},
        {t:"p",v:"μ = 0 is exactly FedAvg; the paper calls FedProx a generalization and re-parametrization of FedAvg. Small μ allows drift; large μ keeps clients near w_t but slows local progress. It also accepts <strong>partial local work</strong> from slow devices instead of dropping them, and reports about <strong>22% higher absolute test accuracy</strong> on average in highly heterogeneous settings."},
        {t:"h",v:"SCAFFOLD: control variates"},
        {t:"eq",v:"local step:   y_i ← y_i − η_l ( g_i(y_i) − c_i + c )\ncontrol:      c_i⁺ ← c_i − c + (x − y_i) / (K η_l)\nserver:       x ← x + (η_g/|S|) Σ (y_i − x),   c ← c + (1/N) Σ (c_i⁺ − c_i)"},
        {t:"p",v:"c_i estimates client i's gradient, c the average over clients. Subtracting c_i and adding c removes each client's bias, so local steps head toward the true optimum even on very different data. Clients are stateful, and with every c_i = 0 SCAFFOLD is FedAvg."},
        {t:"note",class:"warn",v:"<p><b>Notation trap.</b> In SCAFFOLD, <b>N</b> is the number of clients and <b>K</b> is the number of local steps. In McMahan and in my paper, K is the number of clients.</p>"},
        {t:"tbl",v:[["fix","idea"],["Zhao et al.","share a small balanced dataset"],["FedProx","proximal term keeps local models near w_t"],["SCAFFOLD","control variates correct each client's drift"]]},
        {t:"h",v:"Why I did not need them, and why I cite them"},
        {t:"p",v:"My split is IID with full participation, so every client's data looks like the global data and the client optima nearly coincide: little drift, so plain FedAvg works. They are the standard fixes for non-IID data, and a <strong>Dirichlet non-IID split</strong> is my first future experiment. Expected: slower convergence, more oscillation, lower final accuracy, larger E starting to hurt, and FedProx or SCAFFOLD recovering part of the gap."},
        {t:"h",v:"Flower, in my own code"},
        {t:"p",v:"My code uses Flower's newer <strong>Message API</strong>, not the older NumPyClient. The mapping:"},
        {t:"tbl",v:[["older API","my code","file"],["NumPyClient.fit","@app.train() → train_fn_app","client_app.py"],["NumPyClient.evaluate","@app.evaluate() → evaluate_fn_app","client_app.py"],["get_parameters","ArrayRecord(model.state_dict())","both"],["start_server","@app.main() + strategy.start(grid, …)","server_app.py"],["start_simulation","flwr run . (Simulation Engine, Ray)","pyproject.toml"]]},
        {t:"eq",v:"strategy = FedAvg(fraction_train=1.0, fraction_evaluate=1.0)\nstrategy.start(grid, initial_arrays=arrays,\n               train_config=ConfigRecord({\"learning-rate\": lr}),\n               num_rounds=60, evaluate_fn=Dummy(context))"},
        {t:"h",v:"One Flower round, step by step"},
        {t:"eq",v:"1  select        fraction_train = 1.0 → all K clients\n2  broadcast     Message with the global ArrayRecord + config\n3  train         train_fn_app: load weights, 1/K shard, E epochs,\n                 Adam lr 0.001, cross-entropy on mean spikes\n4  reply         new arrays + metrics {train_loss, num-examples}\n5  aggregate     FedAvg: weighted average by num-examples\n6  central eval  evaluate_fn → central_evaluate on the full test set\n7  fed. eval     evaluate_fn_app on each client's test shard\nrepeat for 60 rounds, then save final_model.pt"},
        {t:"note",v:"<p><b>Global Eval Accuracy</b> is the aggregated global model, evaluated on the server after each round, on the <b>full held-out test set</b> (CentralEvaluate.csv). The clients' test shards together make up exactly that set, so the federated accuracy equals it: the second evaluation is redundant.</p>"},
        {t:"h",v:"Facts confirmed from my code"},
        {t:"tbl",v:[["item","value"],["loss","CrossEntropyLoss on time-averaged output spikes (not slayer.loss)"],["prediction","argmax of mean spikes: most spikes wins"],["optimizer","Adam, lr 0.001, re-created each round per client"],["data","61,237 train / 15,313 test .npz files (80/20), pre-split folders"],["per client (train)","K=2: ≈30,619 · K=4: ≈15,310 · K=8: ≈7,655"],["participation","full: fraction_train = fraction_evaluate = 1.0"]]},
        {t:"p",v:"About 7.7 files per recording, so recordings were sliced into T = 16 windows. <strong>Still to confirm:</strong> whether the 80/20 split was made by recording (clean) or by file (possible leakage). Full participation buys a clean ablation with no sampling noise; it costs realism, since real deployments sample few of many devices."}
      ],
      quiz:[
        {q:"What is client drift?",
         o:["Clients dropping out mid-round","Local steps pulling each client toward its own optimum, so the average lands away from the global one","The learning rate decaying over rounds","Clients receiving stale global weights"],a:1,
         h:"Think about where each client's local optimum sits under non-IID data.",
         e:"With non-IID data each client heads to its own optimum; averaging those gives roughly the mean of the client optima, not the true global optimum."},
        {q:"Zhao et al.: how much can accuracy drop on CIFAR-10 under highly skewed non-IID data?",

         h:"MNIST 11, CIFAR 51, KWS 55.",

        {q:"What do Zhao et al. use to measure how non-IID a client is?",

        {q:"What does 'systems heterogeneity' mean?",

        {q:"What does FedProx add to each client's local objective?",

        {q:"In FedProx, what does μ = 0 give?",

        {q:"In SCAFFOLD's local step y ← y − η(g_i − c_i + c), what does (c − c_i) do?",

         h:"c_i ≈ my gradient, c ≈ everyone's average.",
         e:"Subtracting c_i and adding c removes client i's bias, so local steps head toward the true optimum even on very different data."},
        {q:"In SCAFFOLD's notation, what is K?",

        {q:"In my code, which function does local training on a client?",

        {f:"Zhao et al.: weight divergence",b:"<span class='k'>‖w_FedAvg − w_SGD‖ / ‖w_SGD‖</span>Driven by the earth mover's distance between each client's class distribution and the population's."},

const px=(t,T,a,b)=>a+t/T*(b-a);
function rng(id,lab,min,max,step,val){
  return `<div class="ctl"><label for="${id}">${lab}</label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"><output id="${id}v"></output></div>`;
}
const WIDGETS={
 lif:{
  html:`<p class="w-t">One neuron, constant input. Watch where it settles.</p>

    <line id="lif-ss" x1="56" y1="150" x2="632" y2="150" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="2 4"/>
    <polyline id="lif-tr" fill="none" stroke="var(--volt)" stroke-width="2" stroke-linejoin="round"/>
    <g id="lif-sp"></g>
    <text x="50" y="66" text-anchor="end" font-size="11" fill="var(--spike)" font-family="IBM Plex Mono">ϑ</text>
    <text x="50" y="224" text-anchor="end" font-size="11" fill="var(--ink-3)" font-family="IBM Plex Mono">0</text>
    <text id="lif-sl" x="50" y="154" text-anchor="end" font-size="11" fill="var(--ink-3)" font-family="IBM Plex Mono">R·I</text>
    <text x="344" y="248" text-anchor="middle" font-size="11" fill="var(--ink-3)">time (ms)</text>
   </svg>
   ${rng("lif-i","input R·I",0,2,.05,.6)}${rng("lif-t","τ mem",2,40,1,10)}
   <div class="stats"><div class="stat"><span>settles at</span><b id="lif-a">—</b></div><div class="stat"><span>spikes in 200 ms</span><b id="lif-b">—</b></div><div class="stat"><span>firing rate</span><b id="lif-c">—</b></div></div>`,
  init(){
   const T=200,Y0=220,YT=30,UMIN=-.05,UMAX=1.45;
   const py=u=>Y0-(u-UMIN)/(UMAX-UMIN)*(Y0-YT);
   const $=id=>document.getElementById(id);
   function run(){
    const I=+$("lif-i").value,tau=+$("lif-t").value;
    $("lif-iv").textContent=I.toFixed(2);$("lif-tv").textContent=tau+" ms";
    let U=0,pts=[],sp=[];
    for(let t=0;t<=T;t+=.2){
     pts.push(px(t,T,56,632).toFixed(1)+","+py(Math.min(U,1)).toFixed(1));
     U+=.2*(-U+I)/tau;
     if(U>=1){sp.push(t);U=0;pts.push(px(t,T,56,632).toFixed(1)+","+py(1).toFixed(1),px(t,T,56,632).toFixed(1)+","+py(0).toFixed(1));}
    }
    $("lif-tr").setAttribute("points",pts.join(" "));
    $("lif-sp").innerHTML=sp.map(t=>`<line x1="${px(t,T,56,632).toFixed(1)}" y1="34" x2="${px(t,T,56,632).toFixed(1)}" y2="50" stroke="var(--spike)" stroke-width="2"/>`).join("");
    const y=py(Math.min(I,1.42));
    $("lif-ss").setAttribute("y1",y);$("lif-ss").setAttribute("y2",y);$("lif-sl").setAttribute("y",(y+4).toFixed(1));
    $("lif-a").textContent=I.toFixed(2);$("lif-b").textContent=sp.length;$("lif-c").textContent=Math.round(sp.length/.2)+" Hz";
   }
   ["lif-i","lif-t"].forEach(i=>$(i).addEventListener("input",run));run();
  }},

  init(){

 drift:{
  html:`<p class="w-t">Three clients, each with its own optimum. Compare how FedAvg, FedProx and SCAFFOLD handle drift.</p>
   <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px" id="dr-m">
    <button class="btn ghost" style="margin:0;padding:7px 14px" data-m="avg">FedAvg</button>
    <button class="btn ghost" style="margin:0;padding:7px 14px" data-m="prox">FedProx</button>
    <button class="btn ghost" style="margin:0;padding:7px 14px" data-m="scaf">SCAFFOLD</button>
   </div>
   <canvas id="dr-c" style="width:100%;height:340px;display:block"></canvas>
   <div class="trace-lab"><span><i style="background:var(--ok)"></i>client optima</span><span><i style="background:var(--ink)"></i>true global optimum</span><span><i style="background:var(--volt)"></i>global model per round</span><span><i style="background:var(--curr)"></i>client paths, last round</span></div>
   ${rng("dr-h","non-IID strength",0,1,.05,1)}${rng("dr-k","local steps",1,40,1,25)}${rng("dr-mu","FedProx μ",0,3,.1,1)}
   <div class="stats"><div class="stat"><span>final distance to optimum</span><b id="dr-d">—</b></div><div class="stat"><span>method</span><b id="dr-n">—</b></div></div>`,
  init(){
   const $=id=>document.getElementById(id),cv=$("dr-c"),ctx=cv.getContext("2d");let M="avg";
   const bA=[[[4,0],[0,.5]],[[.5,0],[0,4]],[[2,1.5],[1.5,2]]],bO=[[-1.6,1.2],[1.8,1.0],[.2,-1.7]];
   const mv=(A,v)=>[A[0][0]*v[0]+A[0][1]*v[1],A[1][0]*v[0]+A[1][1]*v[1]];
   const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim()||"#888";
   function sim(){
    const h=+$("dr-h").value,K=+$("dr-k").value,mu=+$("dr-mu").value,eta=.08,R=10;
    const A=bA.map(B=>[[1+h*(B[0][0]-1),h*B[0][1]],[h*B[1][0],1+h*(B[1][1]-1)]]),o=bO.map(p=>[p[0]*h,p[1]*h]);
    let S=[[0,0],[0,0]],b=[0,0];A.forEach((a,i)=>{S[0][0]+=a[0][0];S[0][1]+=a[0][1];S[1][0]+=a[1][0];S[1][1]+=a[1][1];const t=mv(a,o[i]);b[0]+=t[0];b[1]+=t[1];});
    const det=S[0][0]*S[1][1]-S[0][1]*S[1][0],xs=[(S[1][1]*b[0]-S[0][1]*b[1])/det,(-S[1][0]*b[0]+S[0][0]*b[1])/det];
    let x=[-2.4,-2.4],c=[0,0],ci=A.map(()=>[0,0]),traj=[x.slice()],paths=[];
    for(let r=0;r<R;r++){const ys=[],cn=[];paths=[];
     A.forEach((a,i)=>{let y=x.slice(),p=[y.slice()];for(let k=0;k<K;k++){let g=mv(a,[y[0]-o[i][0],y[1]-o[i][1]]);
      if(M==="prox")g=[g[0]+mu*(y[0]-x[0]),g[1]+mu*(y[1]-x[1])];
      if(M==="scaf")g=[g[0]-ci[i][0]+c[0],g[1]-ci[i][1]+c[1]];
      y=[y[0]-eta*g[0],y[1]-eta*g[1]];p.push(y.slice());}
      ys.push(y);paths.push(p);cn.push([ci[i][0]-c[0]+(x[0]-y[0])/(K*eta),ci[i][1]-c[1]+(x[1]-y[1])/(K*eta)]);});
     x=[ys.reduce((s,y)=>s+y[0],0)/3,ys.reduce((s,y)=>s+y[1],0)/3];
     if(M==="scaf"){ci=cn;c=[ci.reduce((s,v)=>s+v[0],0)/3,ci.reduce((s,v)=>s+v[1],0)/3];}
     traj.push(x.slice());}
    return{o,xs,traj,paths,x};}
   function run(){
    $("dr-hv").textContent=(+$("dr-h").value).toFixed(2);$("dr-kv").textContent=$("dr-k").value;$("dr-muv").textContent=(+$("dr-mu").value).toFixed(1);
    $("dr-mu").parentNode.style.opacity=M==="prox"?1:.4;
    document.querySelectorAll("#dr-m button").forEach(b=>{const on=b.dataset.m===M;b.style.background=on?"var(--ink)":"none";b.style.color=on?"var(--paper)":"var(--ink)";});
    const W=cv.clientWidth,H=340,d=devicePixelRatio||1;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,W,H);
    const sc=Math.min(W,H)/6.2,cx=W/2,cy=H/2,P=p=>[cx+p[0]*sc,cy-p[1]*sc],s=sim();
    ctx.strokeStyle=css("--rule");ctx.lineWidth=1;for(let g=-3;g<=3;g++){let a=P([g,-3]),e=P([g,3]);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(e[0],e[1]);ctx.stroke();a=P([-3,g]);e=P([3,g]);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(e[0],e[1]);ctx.stroke();}
    ctx.strokeStyle=css("--curr");ctx.lineWidth=1.5;s.paths.forEach(p=>{ctx.beginPath();p.forEach((q,i)=>{const z=P(q);i?ctx.lineTo(z[0],z[1]):ctx.moveTo(z[0],z[1]);});ctx.stroke();});
    ctx.strokeStyle=css("--volt");ctx.lineWidth=2.5;ctx.beginPath();s.traj.forEach((q,i)=>{const z=P(q);i?ctx.lineTo(z[0],z[1]):ctx.moveTo(z[0],z[1]);});ctx.stroke();
    ctx.fillStyle=css("--volt");s.traj.forEach(q=>{const z=P(q);ctx.beginPath();ctx.arc(z[0],z[1],3.5,0,7);ctx.fill();});
    ctx.fillStyle=css("--ok");s.o.forEach(q=>{const z=P(q);ctx.fillRect(z[0]-6,z[1]-6,12,12);});
    const z=P(s.xs);ctx.fillStyle=css("--ink");ctx.beginPath();ctx.arc(z[0],z[1],7,0,7);ctx.fill();
    $("dr-d").textContent=Math.hypot(s.x[0]-s.xs[0],s.x[1]-s.xs[1]).toFixed(3);$("dr-n").textContent={avg:"FedAvg",prox:"FedProx",scaf:"SCAFFOLD"}[M];
   }
   document.querySelectorAll("#dr-m button").forEach(b=>b.onclick=()=>{M=b.dataset.m;run();});
   ["dr-h","dr-k","dr-mu"].forEach(i=>$(i).addEventListener("input",run));
   addEventListener("resize",()=>{if(document.getElementById("dr-c"))run();});run();
  }}
};

/* ============================================================
   STORAGE
   ============================================================ */
const DB={
 get(k,d){try{const v=localStorage.getItem("nip:"+k);return v?JSON.parse(v):d;}catch(e){return d;}},
 set(k,v){try{localStorage.setItem("nip:"+k,JSON.stringify(v));}catch(e){}}
};

/* ============================================================
   RENDER
   ============================================================ */
const app=document.getElementById("app"),crumb=document.getElementById("crumb");
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const find=(s,u)=>{const S=SITE.subjects.find(x=>x.id===s);return[S,S&&S.units.find(x=>x.id===u)];};

function heroSVG(){
  let U=0,d="",T=120;
  for(let n=0;n<=T;n++){
    const x=(n/T*100).toFixed(2),y=(46-Math.min(U,1)*38).toFixed(2);
    d+=(n?"L":"M")+x+" "+y+" ";
    if(U>=1)U=0; U=.86*U+.22;
  }
  return `<svg viewBox="0 0 100 52" width="100%" preserveAspectRatio="none" style="height:120px;display:block" role="img" aria-label="A membrane voltage trace charging and resetting against a threshold line">
    <line x1="0" y1="8" x2="100" y2="8" stroke="var(--spike)" stroke-width=".4" class="dash"/>
    <line x1="0" y1="46" x2="100" y2="46" stroke="var(--rule-2)" stroke-width=".3"/>
    <path d="${d}" fill="none" stroke="var(--volt)" stroke-width=".9" vector-effect="non-scaling-stroke" class="draw"/>
  </svg>`;
}

function home(){
  crumb.innerHTML="";
  app.innerHTML=`<section class="hero">
    <h1>${esc(SITE.title)}</h1>
    <p>${esc(SITE.tagline)}</p>
    <div class="trace-box">${heroSVG()}
      <div class="trace-lab pop" style="animation-delay:2.4s">
        <span><i style="background:var(--volt)"></i>membrane voltage</span>
        <span><i style="background:var(--spike)"></i>firing threshold</span>
      </div>
    </div>
  </section>
  <h2 class="sec">Subjects</h2>
  <div class="subj">${SITE.subjects.map(s=>{
    const done=s.units.filter(u=>DB.get(`q:${s.id}:${u.id}`,null)!==null).length;
    return `<a class="card" href="#/${s.id}"><h3>${esc(s.title)}</h3><p>${esc(s.blurb)}</p>
     <div class="meta"><span>${s.units.length} unit${s.units.length>1?"s":""}</span>${done?`<span class="pill">${done} attempted</span>`:""}</div></a>`;
  }).join("")}</div>`;
}

function subject(sid){
  const[S]=find(sid);if(!S)return home();
  crumb.innerHTML=`<span>/</span><b>${esc(S.title)}</b>`;
  app.innerHTML=`<section class="hero" style="padding:44px 0 30px">
    <h1 style="font-size:clamp(28px,5vw,40px)">${esc(S.title)}</h1><p>${esc(S.blurb)}</p></section>
    <h2 class="sec">Units</h2><div class="subj">${S.units.map(u=>{
      const sc=DB.get(`q:${sid}:${u.id}`,null);
      return `<a class="unit" href="#/${sid}/${u.id}"><span class="unit-n">${esc(u.n)}</span>
       <span style="flex:1;min-width:0"><h3>${esc(u.title)}</h3><p>${esc(u.blurb)}</p></span>
       ${sc!==null?`<span class="pill">${sc.c}/${sc.t}</span>`:""}</a>`;
    }).join("")}</div>`;
}

function unit(sid,uid,tab){
  const[S,U]=find(sid,uid);if(!U)return subject(sid);
  tab=tab||DB.get("tab","notes");DB.set("tab",tab);
  crumb.innerHTML=`<span>/</span><a href="#/${sid}" style="text-decoration:none;color:var(--ink-3)">${esc(S.title)}</a><span>/</span><b>${esc(U.n)}</b>`;
  app.innerHTML=`<section style="padding:36px 0 0">
    <h1 style="font-size:clamp(26px,4.6vw,36px);letter-spacing:-.03em;margin:0 0 8px;line-height:1.12">${esc(U.title)}</h1>
    <p style="font-family:'Source Serif 4',Georgia,serif;color:var(--ink-2);margin:0;max-width:56ch">${esc(U.blurb)}</p></section>
    <div class="tabs" role="tablist">${[["notes","Notes"],["quiz","Quiz"],["cards","Flashcards"]].map(([k,l])=>
      `<button class="tab" role="tab" aria-selected="${tab===k}" data-t="${k}">${l}</button>`).join("")}</div>
    <div id="pane"></div>`;
  app.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{location.hash=`#/${sid}/${uid}/${b.dataset.t}`;});
  ({notes:()=>notes(U),quiz:()=>quiz(S,U),cards:()=>cards(U)}[tab]||(()=>notes(U)))();
}

function notes(U){
  const p=document.getElementById("pane"),pend=[];
  p.className="notes";
  p.innerHTML=U.notes.map(b=>{
    if(b.t==="h")return `<h3>${esc(b.v)}</h3>`;
    if(b.t==="p")return `<p>${b.v}</p>`;
    if(b.t==="eq")return `<div class="eq">${b.v}</div>`;
    if(b.t==="note")return `<div class="note-box ${b.class||""}">${b.v}</div>`;
    if(b.t==="tbl")return `<table class="tbl"><thead><tr>${b.v[0].map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${b.v.slice(1).map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
    if(b.t==="widget"&&WIDGETS[b.v]){pend.push(b.v);return `<div class="w">${WIDGETS[b.v].html}</div>`;}
    return "";
  }).join("");
  pend.forEach(k=>{try{WIDGETS[k].init();}catch(e){console.error(k,e);}});
}

function quiz(S,U){
  const p=document.getElementById("pane");p.className="q";
  let i=0,correct=0,answered=false;
  function draw(){
    if(i>=U.quiz.length){
      DB.set(`q:${S.id}:${U.id}`,{c:correct,t:U.quiz.length});
      p.innerHTML=`<div class="score"><b>${correct}/${U.quiz.length}</b>
        <p>${correct===U.quiz.length?"Every one. This material is solid.":correct>=U.quiz.length*.7?"Close. Look again at the ones you missed.":"Worth another pass through the notes before retrying."}</p>
        <button class="btn" id="again">Start over</button></div>`;
      document.getElementById("again").onclick=()=>{i=0;correct=0;draw();};return;
    }
    const q=U.quiz[i];answered=false;
    p.innerHTML=`<div class="q-top"><span>Question ${i+1} of ${U.quiz.length}</span><span>${correct} right</span></div>
      <div class="q-bar"><i style="width:${i/U.quiz.length*100}%"></i></div>
      <p class="q-p">${esc(q.q)}</p>
      <div id="opts">${q.o.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div>
      ${q.h?`<button class="hint" id="hint">Need a hint?</button>`:""}
      <div id="after"></div>`;
    const hb=document.getElementById("hint");
    if(hb)hb.onclick=()=>{hb.outerHTML=`<p style="color:var(--ink-3);font-size:14px;font-family:'Source Serif 4',serif">${esc(q.h)}</p>`;};
    p.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(answered)return;answered=true;
      const k=+b.dataset.k,ok=k===q.a;if(ok)correct++;
      p.querySelectorAll(".opt").forEach((x,n)=>{x.disabled=true;if(n===q.a)x.classList.add("right");else if(n===k)x.classList.add("wrong");});
      document.getElementById("after").innerHTML=`<div class="expl"><b>${ok?"That's right.":"Not quite."}</b> ${esc(q.e)}</div>
        <button class="btn" id="next">${i===U.quiz.length-1?"See score":"Next question"}</button>`;
      document.getElementById("next").onclick=()=>{i++;draw();};
    });
  }
  draw();
}

function cards(U){
  const p=document.getElementById("pane");p.className="fc-wrap";
  let i=0,flip=false;
  function draw(){
    const c=U.cards[i];
    p.innerHTML=`<div class="fc" id="fc" tabindex="0" role="button" aria-label="Flip card">
        <span class="fc-side">${flip?"answer":"prompt"}</span>
        <div class="${flip?"fc-a":"fc-q"}">${flip?c.b:esc(c.f)}</div>
      </div>
      <div class="fc-nav"><button id="pv" ${i===0?"disabled":""}>Back</button>
        <span>${i+1} / ${U.cards.length} — tap to flip</span>
        <button id="nx" ${i===U.cards.length-1?"disabled":""}>Next</button></div>`;
    const f=document.getElementById("fc");
    f.onclick=()=>{flip=!flip;draw();};
    f.onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();flip=!flip;draw();}};
    document.getElementById("pv").onclick=()=>{if(i>0){i--;flip=false;draw();}};
    document.getElementById("nx").onclick=()=>{if(i<U.cards.length-1){i++;flip=false;draw();}};
  }
  draw();
  document.addEventListener("keydown",function h(e){
    if(!document.getElementById("fc"))return document.removeEventListener("keydown",h);
    if(e.key==="ArrowRight")document.getElementById("nx")?.click();
    if(e.key==="ArrowLeft")document.getElementById("pv")?.click();
  });
}

/* ---------- router ---------- */
function route(){
  const p=location.hash.replace(/^#\/?/,"").split("/").filter(Boolean);
  window.scrollTo(0,0);
  if(!p.length)home();else if(p.length===1)subject(p[0]);else unit(p[0],p[1],p[2]);
}
addEventListener("hashchange",route);

/* ---------- theme ---------- */
const tb=document.getElementById("theme");
const saved=DB.get("theme",null);if(saved)document.documentElement.dataset.theme=saved;
tb.onclick=()=>{
  const cur=document.documentElement.dataset.theme
    ||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
  const nx=cur==="dark"?"light":"dark";
  document.documentElement.dataset.theme=nx;DB.set("theme",nx);
};

route();
</script>
